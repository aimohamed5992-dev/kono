# /etc/nginx/sites-available/kono-api  →  ln -s to sites-enabled, then: certbot --nginx -d api.example.com
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name api.example.com;

    # chat uploads (images / voice notes) arrive as base64 data-URIs
    client_max_body_size 25m;

    location / {
        proxy_pass         http://127.0.0.1:5210;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SignalR (live chat / calls) needs WebSocket upgrade
    location /hub/ {
        proxy_pass         http://127.0.0.1:5210;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # uploaded files + bundled images are static — let nginx cache them
    location ~* ^/(img|uploads)/ {
        proxy_pass http://127.0.0.1:5210;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }
}
